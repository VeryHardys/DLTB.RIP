; Item Extravaganza v1.1 - menu hotkey
; NEW DEFAULT: Insert replaces F9. Fully restart the game after editing.
; Hex or decimal Windows virtual-key codes: Insert 0x2D (45), F9 0x78 (120),
; F8 0x77 (119), Home 0x24 (36). Avoid conflicts with other mods.
; Escape is close-only. Invalid values fall back to Insert.
; Favorites use a separate INI in LocalAppData; do not copy personal logs here.
[Hotkeys]
ToggleVK=0x2D
